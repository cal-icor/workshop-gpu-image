name: notebook
channels:
  - conda-forge

dependencies:
  # 1. Build tools needed to compile llama-cpp-python
  - cmake
  - ninja
  - gcc_linux-64
  - gxx_linux-64
  - cuda-toolkit=12.9
  - pip
  - pip:
      - nbgitpuller==1.3.0b1
      - transformers==4.46.3
      - openai>=1.0
      - anthropic>=0.8
      - python-dotenv
      - langchain>=0.1
      - sentence-transformers==3.4.1
      - otter-grader==6.1.6
      - huggingface_hub
      - gradio
      - docutils<0.20
      - onnxruntime
      - chromadb 
      - langchain-text-splitters 
      - langchain-community
      - langchain-huggingface 
      - langchain-chroma
      - datasets==5.0.1
      - diffusers==0.39.0
      - gpt4all
      - gguf
      - megadetector
      # Resolved 2026-09-09 against the pins above: llama-index 0.14.24 keeps
      # transformers at 4.46.3, sentence-transformers at 3.4.1 and torch at
      # 2.10.0, and shares pydantic 2.13.5 cleanly with chromadb + langchain.
      # Pinned because the HF integrations declare wide ranges
      # (transformers>=4.37,<6) and would otherwise drift on rebuild.
      - llama-index==0.14.24
      - llama-index-llms-huggingface==0.8.0
      - llama-index-embeddings-huggingface==0.8.0
